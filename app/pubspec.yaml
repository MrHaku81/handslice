name: handslice
description: "Mobil-nativer 3D-Drucker-Slicer auf OrcaSlicer-Engine."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  file_picker: ^13.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.0
  mqtt_client: ^10.13.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  share_plus: ^13.3.1
  connectivity_plus: ^7.3.2
  flutter_scene: 0.24.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/LICENSE
    # Orca-Profile fuer CC2 0.4 + 0.20mm. Verzeichnisse werden
    # komplett eingebunden – _extractBundledProfiles() iteriert
    # beim ersten App-Start ueber das AssetManifest, damit neue
    # Profile (z. B. weitere Filament-Varianten) automatisch
    # mitwandern.
    - assets/profiles/Elegoo/machine/
    - assets/profiles/Elegoo/machine/ECC2/
    - assets/profiles/Elegoo/process/
    - assets/profiles/Elegoo/process/ECC2/
    - assets/profiles/Elegoo/filament/
    - assets/profiles/Elegoo/filament/BASE/
    - assets/profiles/Elegoo/filament/ECC2/
    # Phase 4.1: aus Orca v2.4.2 mechanisch erzeugter Options-Baum
    # (engine/scripts/build_settings_schema.py). Enthaelt Reiter,
    # Gruppen, Stufen und Deutsch-Uebersetzungen.
    - assets/settings-schema.json
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
